  <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M24 20.6 L24 24.2 L21.2 26.2 L24.2 29 L21.4 32.2"/>
  <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M30.6 19 L30.6 22.6 L27.8 24.6 L30.8 27.4 L28 30.6"/>
</symbol>

<symbol id="m-perfect" viewBox="0 0 48 48">
  <!-- 皆 all: an ensō, the brushed circle of something whole, left just open where the brush lifted -->
  <path fill="currentColor" d="M27.6 6.6 C37.4 7.6 43.6 15.6 42.8 25.2 C42 35.4 33.4 42.6 23.4 42 C13.6 41.4 5.8 33.4 6.4 23.4 C6.8 16.6 10.6 11 16.2 8.2 C15 10.6 14.2 12.4 13.2 15 C10.6 18.8 10 23 10.6 26.6 C11.8 33.6 17.6 38.4 24.2 38.4 C31.8 38.4 38.6 32.2 38.6 24.6 C38.8 17.2 34.4 11.8 27.4 9.8 Z"/>
</symbol>
</svg>
