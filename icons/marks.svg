</symbol>

<symbol id="m-border" viewBox="0 0 48 48">
  <!-- a shimenawa: a rope sagging between two posts with paper streamers hanging from it, the mark of a boundary -->
  <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M7.4 8 L7.8 43.4"/>
  <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M40.6 8 L40.2 43.4"/>
  <path fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" d="M7.6 12.6 C17.8 21.4 30.2 21.6 40.4 12.6"/>
