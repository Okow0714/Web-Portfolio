<!doctype html>
<html lang="mn">

<head>
  <meta charset="utf-8">
  <!--
    Play Store feature graphic, 1024x500. Same wine/gold family as the share cards beside it, but
    built around the CURRENT brand mark rather than the 言 seal those cards still carry -- the mark
    replaced it in August and this is a new asset, so there is no reason to inherit the stale one.

    Two layout constraints that are not obvious:
      Google composites this banner on several surfaces and can crop its edges, so nothing that
      has to be read sits near them -- the type stays inside the left two-thirds and the mark
      bleeds off the right on purpose, where losing an edge costs nothing.
      Fraunces has no Cyrillic subset, so the Mongolian would silently fall back to a system serif
      if it were set in the display face. Latin wordmark in Fraunces, Mongolian in IBM Plex Sans,
      which is exactly how the site itself splits them.
  -->
  <link rel="stylesheet" href="http://localhost:8123/fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }

    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #563345 0%, #4a2c3a 46%, #351f28 100%);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      color: #f9efe3;
    }

    .frame {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(232, 189, 109, 0.34);
      border-radius: 4px;
      z-index: 5;
    }

    /* The mark, huge and faint, bleeding off the right edge. Decorative only: everything that
       has to be read lives to its left. */
    .wash {
      position: absolute;
      right: -70px;
      top: 50%;
      transform: translateY(-50%);
      width: 430px;
      opacity: 0.13;
      z-index: 1;
    }

    .inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 64px;
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .seal {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #e8bd6d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .seal img {
      width: 34px;
      height: 34px;
      display: block;
    }

    .word {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    h1 {
      font-size: 56px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.015em;
      max-width: 640px;
      text-wrap: balance;
    }

    .stat {
      margin-top: 20px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #e8bd6d;
    }

    .url {
      margin-top: 26px;
      font-size: 17px;
      color: #d3b9ab;
    }
  </style>
</head>

<body>
  <div class="frame"></div>
  <img class="wash" src="http://localhost:8123/icons/brand-mark.png" alt="">
  <div class="inner">
    <div class="brand">
      <div class="seal"><img src="http://localhost:8123/icons/brand-mark.png" alt=""></div>
      <div class="word">Khan Japanese</div>
    </div>
    <h1>Япон хэлтэй найзалцгаая</h1>
    <div class="stat">6 ХЭРЭГСЭЛ · N5-ААС N1 ХҮРТЭЛ · МОНГОЛ ХЭЛ ДЭЭР</div>
    <div class="url">khan-japanese.org</div>
  </div>
</body>

</html>
