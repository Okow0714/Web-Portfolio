<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - Sarantsatsral Ganzorig</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reset your account password.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .reset-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-surface);
            box-shadow: var(--shadow-md);
            padding: 40px 30px 30px;
        }

        .reset-card h1 {
            font-size: 1.4rem;
            margin: 0 0 20px;
        }

        #reset-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #reset-form label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        #reset-form input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
        }

        #reset-form input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #reset-form .auth-btn {
            margin-top: 16px;
            text-align: center;
        }

        #reset-status {
            font-size: 0.9rem;
            margin: 4px 0 0;
        }

        #reset-status.reset-error { color: #d33f3f; }
        #reset-status.reset-success { color: var(--accent-dark); }
    </style>
</head>

<body>
    <div class="background-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
    </div>

    <div class="reset-wrap">
        <div class="reset-card">
            <h1>Set a New Password</h1>
            <p id="reset-intro" style="color: var(--text-secondary); font-size: 0.9rem;">Waiting for the reset link to verify…</p>
            <form id="reset-form" class="hidden">
                <label for="reset-password">New password</label>
                <input type="password" id="reset-password" required minlength="6" autocomplete="new-password">
                <label for="reset-password-confirm">Confirm new password</label>
                <input type="password" id="reset-password-confirm" required minlength="6" autocomplete="new-password">
                <p id="reset-status" class="hidden"></p>
                <button type="submit" class="auth-btn">Set Password</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const introEl = document.getElementById('reset-intro');
        const formEl = document.getElementById('reset-form');
        const statusEl = document.getElementById('reset-status');
        let recoveryReady = false;

        // Supabase's client auto-parses the recovery token from the URL on load and fires
        // this event once it's established a temporary "recovery" session.
        supabaseClient.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') {
                recoveryReady = true;
                introEl.classList.add('hidden');
                formEl.classList.remove('hidden');
            }
        });

        // If the link is invalid/expired, no PASSWORD_RECOVERY event ever fires — let the
        // visitor know instead of leaving them stuck on "verifying" forever.
        setTimeout(() => {
            if (!recoveryReady) {
                introEl.textContent = "This reset link is invalid or has expired. Request a new one from the login form.";
            }
        }, 4000);

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('reset-password').value;
            const pwConfirm = document.getElementById('reset-password-confirm').value;
            statusEl.classList.remove('reset-error', 'reset-success');

            if (pw !== pwConfirm) {
                statusEl.textContent = "Passwords don't match.";
                statusEl.classList.add('reset-error');
                statusEl.classList.remove('hidden');
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password: pw });
            if (error) {
                statusEl.textContent = error.message;
                statusEl.classList.add('reset-error');
                statusEl.classList.remove('hidden');
                return;
            }

            statusEl.textContent = 'Password updated! Redirecting…';
            statusEl.classList.add('reset-success');
            statusEl.classList.remove('hidden');
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        });
    </script>
</body>

</html>
